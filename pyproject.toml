[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxctron-review-analysis"
version = "0.1.0"
description = "Analyze human review decisions for boxctron-describes image output."
requires-python = ">=3.10"
dependencies = ["scipy>=1.14"]

[tool.setuptools]
py-modules = ["analyze_review_responses", "html_explorer"]

[project.optional-dependencies]
dev = ["playwright>=1.50", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
